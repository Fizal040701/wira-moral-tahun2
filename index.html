function badges(){return `<div class="badges">${[[5,'🌟 Kenali Nilai Murni'],[10,'💞 Sahabat Keluarga'],[14,'🏡 Penjelajah Nilai']].map(([n,t])=>`<div class="medal ${state.done.size<n?'lock':''}">${t} ${state.done.size>=n?'✓':'🔒'}</div>`).join('')}<div class="medal ${state.answers.length===20?'':'lock'}">🏆 Wira Moral ${state.answers.length===20?'✓':'🔒'}</div></div>`}
function map(){return `${house()}<section class="panel"><div class="row"><h2>🗺️ Peta 14 nilai murni</h2><span class="pill">${state.done.size} daripada 14 unit diteroka</span></div><div class="progress"><div style="width:${state.done.size/14*100}%"></div></div><p class="muted">Tekan setiap kad untuk belajar, dengar nota dan jawab aktiviti mini.</p><div class="layout">${units.map((u,i)=>`<button class="unit ${state.done.has(i)?'done':''}" data-unit="${i}"><span class="emoji">${u.icon}</span><span><strong>Unit ${i+1}: ${safe(u.title)}</strong><small>${safe(u.lesson)}</small><small>${state.done.has(i)?'✅ Sudah diteroka':'🔍 Teroka sekarang'}</small></span></button>`).join('')}</div></section>`}
function unitPage(){let i=state.unit,u=units[i];return `<section class="panel"><div class="row"><span class="pill">Unit ${i+1} / 14</span><span class="emoji">${u.icon}</span></div><h2>${safe(u.title)}</h2><h3>${safe(u.lesson)}</h3><div class="facts"><div class="fact"><b>📖 Maksud</b><p>${safe(u.meaning)}</p></div><div class="fact"><b>🏡 Contoh amalan</b><p>• ${safe(u.examples[0])}<br>• ${safe(u.examples[1])}</p></div><div class="fact"><b>🌟 Kebaikan</b><p>${safe(u.benefit)}</p></div></div><p><button id="listenUnit">🔊 Dengar nota</button> <button id="stopAudio">⏹️ Berhenti</button></p><h3>🎯 Aktiviti mini</h3><p><b>Situasi:</b> ${safe(u.scenario)}</p><p>Apakah tindakan yang paling sesuai?</p><div class="options">${u.mini.map((o,j)=>`<button class="opt ${state.miniChoice===j?(j===u.answer?'correct':'wrong'):''}" data-mini="${j}" ${state.miniChoice!==null?'disabled':''}>${'ABC'[j]}. ${safe(o)}</button>`).join('')}</div>${state.miniChoice!==null?`<div class="feedback">${state.miniChoice===u.answer?'✅ Syabas!':'💡 Mari belajar.'} Jawapan: <b>${'ABC'[u.answer]}. ${safe(u.mini[u.answer])}</b></div>`:''}<div class="endbuttons"><button data-route="map">🗺️ Kembali ke peta</button><button id="markUnit" class="btn-primary">✅ Tandakan selesai</button><button id="nextUnit" class="btn-gold">Unit seterusnya ➜</button></div></section>`}
function feeling(){let i=state.feelIndex,f=feelings[i],entry=state.feelAnswers[i]||{};return `<section class="panel"><h2>😊 Perasaan Saya</h2><p>Situasi ${i+1} daripada 5</p><div class="progress"><div style="width:${(i+1)*20}%"></div></div><p class="question">${safe(f[0])}</p><p>Bagaimanakah perasaan kamu?</p><div class="options">${['😊 Gembira','🥰 Bangga','🙏 Bersyukur','😌 Tenang','🌟 Puas hati'].map((m,j)=>`<button data-emotion="${j}" class="opt ${entry.emotion===j?'correct':''}">${m}</button>`).join('')}</div><label for="reason">Saya berasa demikian kerana...</label><textarea id="reason" placeholder="Tuliskan sebab perasaan kamu.">${safe(entry.reason||'')}</textarea><div class="endbuttons"><button id="feelingBack" ${i===0?'disabled':''}>← Sebelumnya</button><button id="feelingExample">💡 Lihat contoh ayat</button><button id="feelingNext" class="btn-primary">${i===4?'Selesai':'Seterusnya →'}</button></div><div id="feelingHint" class="feedback hidden"></div><p class="muted">Tiada satu perasaan yang wajib dipilih. Berikan alasan yang munasabah.</p></section>`}
function quiz(){if(state.answers.length===20)return results();let i=state.quizIndex,q=qraw[i],selected=state.answers[i];return `<section class="panel"><div class="row"><h2>🧠 Cabaran Akhir Wira Moral</h2><span class="score">⭐ ${state.answers.filter((a,j)=>a===qraw[j][3]).length*5}/100</span></div><div class="row"><span class="pill">Soalan ${i+1} / 20</span><span class="muted">Unit ${q[0]}: ${safe(units[q[0]-1].title)}</span></div><div class="progress"><div style="width:${(i+1)*5}%"></div></div><p class="question">${safe(q[1])}</p><button id="listenQuestion">🔊 Dengar soalan dan pilihan</button><div class="options">${q[2].map((o,j)=>`<button class="opt ${selected!==undefined?(j===q[3]?'correct':j===selected?'wrong':''):''}" data-answer="${j}" ${selected!==undefined?'disabled':''}>${'ABCD'[j]}. ${safe(o)}</button>`).join('')}</div>${selected!==undefined?`<div class="feedback"><strong>${selected===q[3]?'✅ Betul! +5 markah':'❌ Belum tepat.'}</strong><p>Jawapan: <b>${'ABCD'[q[3]]}. ${safe(q[2][q[3]])}</b></p>${safe(q[4])}</div><button class="btn-primary" id="nextQuestion">${i===19?'🏆 Lihat keputusan':'Soalan seterusnya →'}</button>`:'<p class="muted">Pilih satu jawapan. Jawapan yang telah dipilih tidak boleh diubah untuk percubaan ini.</p>'}</section>`}
function score(){return state.answers.reduce((s,a,i)=>s+(a===qraw[i][3]?5:0),0)}function level(n){return n>=90?'WIRA MORAL CEMERLANG':n>=70?'WIRA MORAL HEBAT':n>=50?'WIRA MORAL BIJAK':'TERUSKAN USAHA'}
function results(){let n=score(),correct=n/5;if(state.review)return `<section class="panel"><h2>📋 Semakan 20 jawapan</h2><button id="backResults">← Ke keputusan</button>${qraw.map((q,i)=>`<div class="fact" style="margin:10px 0"><b>${i+1}. ${safe(q[1])}</b><p>Jawapan kamu: <strong>${'ABCD'[state.answers[i]]}. ${safe(q[2][state.answers[i]])}</strong> ${state.answers[i]===q[3]?'✅':'❌'}</p><p>Jawapan betul: <b>${'ABCD'[q[3]]}. ${safe(q[2][q[3]])}</b></p><p class="muted">${safe(q[4])}</p></div>`).join('')}</section>`;let wrong=[...new Set(qraw.filter((q,i)=>state.answers[i]!==q[3]).map(q=>q[0]))];return `<section class="panel"><h2>🏆 Tahniah! Cabaran selesai</h2><p>Nama: <b>${safe(state.name||'Wira Moral')}</b></p><div class="score" style="font-size:48px">${n}/100</div><h3>${level(n)}</h3><p>✅ Betul: ${correct}/20 &nbsp; ❌ Salah: ${20-correct}/20</p><p>${wrong.length?'Cadangan ulang kaji: '+wrong.map(i=>'Unit '+i+' ('+units[i-1].title+')').join(', '):'Hebat! Semua jawapan betul.'}</p><div class="endbuttons"><button id="showReview">📋 Semak jawapan</button><button id="restart" class="btn-primary">🔄 Cuba lagi</button><button id="goCert" class="btn-gold">🏅 Lihat sijil</button><button data-route="map">📖 Ulang kaji nota</button></div></section><section class="panel"><h2>Lencana pencapaian</h2>${badges()}</section>`}
function cert(){if(state.answers.length!==20)return `<section class="panel"><h2>Sijil belum tersedia</h2><p>Jawab kesemua 20 soalan dahulu untuk mendapatkan sijil.</p><button data-route="quiz">Mula kuiz</button></section>`;return `<section class="panel print-panel"><div class="cert"><div style="font-size:52px">🏅</div><h2>SIJIL WIRA MORAL TAHUN 2</h2><p>Dengan ini diperakui bahawa</p><div class="certname">${safe(state.name||'Wira Moral')}</div><p>telah melengkapkan</p><h3>Modul Ulang Kaji Interaktif Pendidikan Moral Tahun 2</h3><p><b>TEMA: SAYA DAN KELUARGA</b></p><h2>${score()}/100</h2><p><strong>${level(score())}</strong></p><p>🌟 Rajin belajar, berbudi pekerti mulia 🌟</p><small>Tarikh: ${new Date().toLocaleDateString('ms-MY',{year:'numeric',month:'long',day:'numeric'})}</small></div><div class="endbuttons no-print"><button class="btn-primary" id="printCert">🖨️ Cetak / Simpan PDF</button><button data-route="quiz">← Kembali ke keputusan</button></div></section>`}
function render(){updated();root.innerHTML=state.route==='home'?home():state.route==='map'?map():state.route==='unit'?unitPage():state.route==='feelings'?feeling():state.route==='quiz'?quiz():state.route==='certificate'?cert():home();attach()}
function attach(){root.querySelectorAll('[data-route]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.route)));root.querySelectorAll('[data-unit]').forEach(b=>b.addEventListener('click',()=>{state.unit=+b.dataset.unit;state.miniChoice=null;state.done.add(state.unit);store();nav('unit')}));let n=el('#studentName');if(n)n.addEventListener('input',()=>{state.name=n.value.trim().slice(0,70);store()});let lu=el('#listenUnit');if(lu)lu.addEventListener('click',()=>{let u=units[state.unit];say(`${u.title}. ${u.meaning}. Contoh. ${u.examples.join('. ')}. Kebaikan. ${u.benefit}`)});let sa=el('#stopAudio');if(sa)sa.addEventListener('click',stop);root.querySelectorAll('[data-mini]').forEach(b=>b.addEventListener('click',()=>{state.miniChoice=+b.dataset.mini;state.miniDone.add(state.unit);store();render()}));let mu=el('#markUnit');if(mu)mu.addEventListener('click',()=>{state.done.add(state.unit);store();nav('map')});let nu=el('#nextUnit');if(nu)nu.addEventListener('click',()=>{state.done.add(state.unit);store();state.unit=(state.unit+1)%14;state.miniChoice=null;render();window.scrollTo(0,0)});
root.querySelectorAll('[data-emotion]').forEach(b=>b.addEventListener('click',()=>{state.feelAnswers[state.feelIndex]??={};state.feelAnswers[state.feelIndex].emotion=+b.dataset.emotion;render()}));let reason=el('#reason');if(reason)reason.addEventListener('input',()=>{state.feelAnswers[state.feelIndex]??={};state.feelAnswers[state.feelIndex].reason=reason.value});let fb=el('#feelingBack');if(fb)fb.addEventListener('click',()=>{state.feelIndex--;render()});let fn=el('#feelingNext');if(fn)fn.addEventListener('click',()=>{if(state.feelIndex<4){state.feelIndex++;render()}else nav('map')});let fe=el('#feelingExample');if(fe)fe.addEventListener('click',()=>{let d=el('#feelingHint');d.textContent=feelings[state.feelIndex][1];d.classList.remove('hidden')});
let lq=el('#listenQuestion');if(lq)lq.addEventListener('click',()=>{let q=qraw[state.quizIndex];say(`Soalan ${state.quizIndex+1}. ${q[1]}. ${q[2].map((v,i)=>`Pilihan ${'ABCD'[i]}. ${v}`).join('. ')}`)});root.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{if(state.answers[state.quizIndex]!==undefined)return;state.answers[state.quizIndex]=+b.dataset.answer;stop();render()}));let nq=el('#nextQuestion');if(nq)nq.addEventListener('click',()=>{state.quizIndex=Math.min(19,state.quizIndex+1);render();window.scrollTo(0,0)});let sr=el('#showReview');if(sr)sr.addEventListener('click',()=>{state.review=true;render()});let br=el('#backResults');if(br)br.addEventListener('click',()=>{state.review=false;render()});let rr=el('#restart');if(rr)rr.addEventListener('click',()=>{if(confirm('Mulakan semula kuiz 20 soalan?')){state.answers=[];state.quizIndex=0;state.review=false;render()}});let gc=el('#goCert');if(gc)gc.addEventListener('click',()=>nav('certificate'));let pc=el('#printCert');if(pc)pc.addEventListener('click',()=>window.print())}
document.querySelectorAll('.topnav [data-route]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.route)));el('#soundToggle').addEventListener('click',()=>{state.voice=!state.voice;if(!state.voice)stop();updated()});if('speechSynthesis'in window)speechSynthesis.getVoices();render();
})();
</script></body></html>
